name: Pest TIA Baseline

on:
    push:
        branches:
            - develop
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    baseline:
        name: Test Dependency Graph
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Attach baseline branch
              run: git switch --force-create develop "$GITHUB_SHA"

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  coverage: pcov

            - name: Prepare Laravel
              run: |
                  cp .env.testing .env
                  php artisan key:generate
                  php artisan config:cache

            - name: Verify PCOV
              run: php --ri pcov

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Resolve npm cache directory
              id: npm-cache
              shell: bash
              run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: Restore npm cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.npm-cache.outputs.directory }}
                  key: npm-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-node-24-

            - name: Install frontend dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Install Chromium and Linux dependencies
              run: npx playwright install --with-deps chromium

            - name: Build frontend assets
              run: npm run build

            - name: Record test dependency graph
              run: php -d memory_limit=4G ./vendor/bin/pest --ci --tia --fresh --parallel

            - name: Resolve TIA baseline path
              id: baseline
              shell: bash
              run: |
                  baseline_path="$(vendor/bin/pest --baseline)"
                  test -d "$baseline_path"
                  test -f "$baseline_path/graph.json"
                  echo "path=$baseline_path" >> "$GITHUB_OUTPUT"

            - name: Upload TIA baseline
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pest-tia-baseline
                  path: ${{ steps.baseline.outputs.path }}
                  include-hidden-files: true
                  retention-days: 30
