name: Pest TIA Baseline

on:
    push:
        branches:
            - development
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    baseline:
        name: Test Dependency Graph
        runs-on: [self-hosted, macOS, ARM64, mac-studio-ringside]
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install frontend dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Install Chromium
              run: npx playwright install chromium

            - name: Build frontend assets
              run: npm run build

            - name: Prepare Laravel
              run: |
                  cp .env.testing .env
                  php artisan key:generate
                  php artisan config:cache

            - name: Verify PCOV
              run: php --ri pcov

            - name: Record test dependency graph
              run: php -d memory_limit=4G ./vendor/bin/pest --ci --tia --fresh --coverage

            - name: Resolve TIA baseline path
              id: baseline
              run: echo "path=$(vendor/bin/pest --baseline)" >> "$GITHUB_OUTPUT"

            - name: Upload TIA baseline
              uses: actions/upload-artifact@v7
              with:
                  name: pest-tia-baseline
                  path: ${{ steps.baseline.outputs.path }}
                  include-hidden-files: true
                  retention-days: 30
