name: Pest TIA Baseline

on:
    push:
        branches:
            - development
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    baseline:
        name: Test Dependency Graph
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Attach baseline branch
              run: git switch --force-create development "$GITHUB_SHA"

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  coverage: pcov

            - name: Prepare Laravel
              run: |
                  cp .env.testing .env
                  php artisan key:generate
                  php artisan config:cache

            - name: Verify PCOV
              run: php --ri pcov

            - name: Record test dependency graph
              run: php -d memory_limit=4G ./vendor/bin/pest --ci --tia --fresh --coverage --parallel --testsuite "Feature","Integration","Unit"

            - name: Resolve TIA baseline path
              id: baseline
              shell: bash
              run: |
                  baseline_path="$(vendor/bin/pest --baseline)"
                  test -d "$baseline_path"
                  test -f "$baseline_path/graph.json"
                  echo "path=$baseline_path" >> "$GITHUB_OUTPUT"

            - name: Upload TIA baseline
              uses: actions/upload-artifact@v7
              with:
                  name: pest-tia-baseline
                  path: ${{ steps.baseline.outputs.path }}
                  include-hidden-files: true
                  retention-days: 30
