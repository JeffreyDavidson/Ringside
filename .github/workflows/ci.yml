name: Application Quality

on:
    push:
        branches:
            - development
            - master
    pull_request:
        branches:
            - development
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    tests:
        name: CI - PHP-8.4 - Laravel-13.*
        runs-on: [self-hosted, macOS, ARM64, mac-studio-ringside]
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare Laravel
              run: |
                  cp .env.testing .env
                  php artisan key:generate
                  php artisan config:cache

            - name: Check PHP and Blade formatting
              run: composer test:lint

            - name: Check Rector
              run: composer test:rector

            - name: Run static analysis
              run: composer test:types

            - name: Check Pest type coverage
              run: composer test:type-coverage

            - name: Run application tests
              run: php -d memory_limit=4G ./vendor/bin/pest --ci --testsuite "Feature","Integration","Unit" --no-coverage --parallel

    browser-tests:
        name: Browser Tests
        needs: tests
        runs-on: [self-hosted, macOS, ARM64, mac-studio-ringside]
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install frontend dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Install Chromium
              run: npx playwright install chromium

            - name: Build frontend assets
              run: npm run build

            - name: Prepare Laravel
              run: |
                  cp .env.testing .env
                  php artisan key:generate
                  php artisan config:cache

            - name: Run browser tests
              run: php -d memory_limit=4G ./vendor/bin/pest --ci --testsuite Browser --parallel
