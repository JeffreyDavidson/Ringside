name: Application Quality

on:
    push:
        branches:
            - development
            - master
    pull_request:
        branches:
            - development
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    dependency-validation:
        name: Dependency validation
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Validate Composer configuration
              run: composer validate --strict --no-check-publish

            - name: Verify Composer platform requirements
              run: composer check-platform-reqs --no-dev

            - name: Verify PHP 8.5 compatibility
              run: composer why-not php 8.5 --locked

            - name: Audit Composer dependencies
              run: composer audit --locked --format=plain

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Resolve npm cache directory
              id: npm-cache
              shell: bash
              run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: Restore npm cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.npm-cache.outputs.directory }}
                  key: npm-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-node-24-

            - name: Install npm dependencies
              run: npm ci --ignore-scripts --no-fund

            - name: Audit npm dependencies
              shell: bash
              run: |
                  for attempt in 1 2 3; do
                      if timeout 90s npm audit --audit-level=high --fetch-timeout=30000 --fetch-retries=1; then
                          exit 0
                      fi

                      if [ "$attempt" -eq 3 ]; then
                          exit 1
                      fi

                      echo "::warning::npm audit attempt $attempt failed; retrying after a short delay."
                      sleep "$((attempt * 10))"
                  done

    lint:
        name: PHP and Blade formatting
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Resolve npm cache directory
              id: npm-cache
              shell: bash
              run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: Restore npm cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.npm-cache.outputs.directory }}
                  key: npm-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-node-24-

            - name: Install Blade formatter dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Check PHP and Blade formatting
              run: composer test:lint

    rector:
        name: Rector
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Check Rector
              run: composer test:rector

    static-analysis:
        name: PHPStan static analysis
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run static analysis
              run: composer test:types

    type-coverage:
        name: Pest type coverage
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare Laravel
              run: |
                  cp .env.testing .env
                  php artisan key:generate
                  php artisan config:cache

            - name: Check Pest type coverage
              run: composer test:type-coverage

    frontend-verification:
        name: Frontend verification
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Resolve npm cache directory
              id: npm-cache
              shell: bash
              run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: Restore npm cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.npm-cache.outputs.directory }}
                  key: npm-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-node-24-

            - name: Install frontend dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Run frontend lint
              run: npm run lint

            - name: Build frontend assets
              run: npm run build

    application-tests:
        name: CI - PHP-8.5 - Laravel-13.*
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            actions: read
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  coverage: pcov

            - name: Prepare Laravel
              run: |
                  cp .env.testing .env
                  php artisan key:generate
                  php artisan config:cache

            - name: Run impacted application tests with full-suite fallback
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set +e
                  php -d memory_limit=4G ./vendor/bin/pest --ci --configuration phpunit.application.xml --tia --baselined --filtered --no-coverage --parallel
                  tia_status=$?
                  set -e

                  if [ "$tia_status" -eq 0 ]; then
                    exit 0
                  fi

                  echo "::warning::Pest TIA was unavailable or failed validation; running the full application test suite."
                  php -d memory_limit=4G ./vendor/bin/pest --ci --configuration phpunit.application.xml --no-coverage --parallel

    browser-tests:
        name: Browser Tests
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Resolve npm cache directory
              id: npm-cache
              shell: bash
              run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: Restore npm cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.npm-cache.outputs.directory }}
                  key: npm-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-node-24-

            - name: Install frontend dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Install Chromium and Linux dependencies
              run: npx playwright install --with-deps chromium

            - name: Build frontend assets
              run: npm run build

            - name: Prepare Laravel
              run: |
                  cp .env.testing .env
                  php artisan key:generate
                  php artisan config:cache

            - name: Run browser tests
              run: php -d memory_limit=4G ./vendor/bin/pest --ci --testsuite Browser --parallel

            - name: Upload browser failure screenshots
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: pest-browser-screenshots
                  path: tests/Browser/Screenshots
                  if-no-files-found: ignore
                  retention-days: 7
