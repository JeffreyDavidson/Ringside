name: PHP quality

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master

concurrency:
  group: php-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: [self-hosted, macOS, ARM64, mac-studio-ringside]
    name: Rector and Pest type coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        run: |
          php_bin_dir="$(brew --prefix php@8.4)/bin"
          echo "$php_bin_dir" >> "$GITHUB_PATH"
          "$php_bin_dir/php" -v

      - name: Install Composer
        run: |
          mkdir -p "$RUNNER_TEMP/composer-bin"
          curl -sS https://getcomposer.org/installer -o "$RUNNER_TEMP/composer-setup.php"
          php "$RUNNER_TEMP/composer-setup.php" --install-dir="$RUNNER_TEMP/composer-bin" --filename=composer
          echo "$RUNNER_TEMP/composer-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/composer-bin/composer" --version

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-quality-${{ runner.os }}-PHP8.4-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: php-quality-${{ runner.os }}-PHP8.4-composer-

      - name: Add token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config github-oauth.github.com "$GITHUB_TOKEN"

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check Rector
        run: composer test:rector

      - name: Check Pest type coverage
        run: composer test:type-coverage
