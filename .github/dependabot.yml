version: 2

# Dependency update PRs target the integration branch (develop) and use Conventional Commit titles.
# Minor and patch updates are grouped per ecosystem to keep the PR count low; major updates arrive
# as individual PRs so they can be reviewed on their own. Nothing merges automatically: every update
# still goes through the required checks and a human merge.
updates:
    - package-ecosystem: composer
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/New_York
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'chore(deps)'
          prefix-development: 'chore(deps-dev)'
      labels:
          - dependencies
      groups:
          # The framework, Livewire and Larastan change behaviour, test helpers and static-analysis types often
          # enough that one red package must not block the rest of the group, so each gets its own PR.
          composer-minor-and-patch:
              update-types:
                  - minor
                  - patch
              exclude-patterns:
                  - 'laravel/framework'
                  - 'livewire/livewire'
                  - 'larastan/larastan'

    - package-ecosystem: npm
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/New_York
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'chore(deps)'
          prefix-development: 'chore(deps-dev)'
      labels:
          - dependencies
      groups:
          npm-minor-and-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directories:
          - /
          - /.github/actions/setup-php-composer
      target-branch: develop
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/New_York
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'ci(deps)'
      labels:
          - dependencies
      groups:
          github-actions:
              update-types:
                  - minor
                  - patch
