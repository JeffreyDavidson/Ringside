version: 2

# Dependency update PRs target the integration branch (develop) and use Conventional Commit titles.
# Minor and patch updates are grouped per ecosystem to keep the PR count low; major updates arrive
# as individual PRs so they can be reviewed on their own. Nothing merges automatically: every update
# still goes through the required checks and a human merge.
updates:
    - package-ecosystem: composer
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/New_York
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'chore(deps)'
          prefix-development: 'chore(deps-dev)'
      labels:
          - dependencies
      # Guzzle 8, promises 3 and psr7 3 must move together and the app never calls them directly (only the framework,
      # Nightwatch and ramsey/uuid depend on them), so a major bump gains nothing and cannot be validated by our suite.
      # See docs/architecture/refactoring-backlog.md, "Blocked dependency upgrades".
      ignore:
          - dependency-name: 'guzzlehttp/guzzle'
            update-types: ['version-update:semver-major']
          - dependency-name: 'guzzlehttp/promises'
            update-types: ['version-update:semver-major']
          - dependency-name: 'guzzlehttp/psr7'
            update-types: ['version-update:semver-major']
      groups:
          # The framework, Livewire and Larastan change behaviour, test helpers and static-analysis types often
          # enough that one red package must not block the rest of the group, so each gets its own PR.
          composer-minor-and-patch:
              update-types:
                  - minor
                  - patch
              exclude-patterns:
                  - 'laravel/framework'
                  - 'livewire/livewire'
                  - 'larastan/larastan'

    - package-ecosystem: npm
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/New_York
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'chore(deps)'
          prefix-development: 'chore(deps-dev)'
      labels:
          - dependencies
      groups:
          # laravel-vite-plugin declares the Vite major it supports as a peer dependency (2.x needs Vite 7, 3.x needs
          # Vite 8), so a lone bump of either one fails `npm ci`. Group them, major updates included, so they arrive as
          # one pull request. Dependabot assigns a dependency to the first group that matches, so this group stays above
          # npm-minor-and-patch.
          vite-toolchain:
              patterns:
                  - 'vite'
                  - 'laravel-vite-plugin'
          npm-minor-and-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directories:
          - /
          - /.github/actions/setup-php-composer
      target-branch: develop
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/New_York
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'ci(deps)'
      labels:
          - dependencies
      groups:
          github-actions:
              update-types:
                  - minor
                  - patch
